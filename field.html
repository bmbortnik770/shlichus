<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>שטח CRM</title>
    <link rel="manifest" href="field-manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet' />
    <link rel="stylesheet" href="field-style.css?v=23"> 
</head>
<body>
    <div id="f-splash" class="f-splash">
        <img src="favicon.ico" alt="Logo">
        <h2 style="margin-top:15px; letter-spacing: 1px; color: var(--accent);">שליחות CRM</h2>
    </div>

    <div id="f-sync-status" class="f-sync-indicator" onclick="fieldApp.forceSync()">
        <i class="fas fa-cloud-download-alt"></i> <span>ממתין לסנכרון</span>
    </div>

    <div id="f-login" class="view-container" style="display:none; padding:40px 20px; text-align:center; height: 100vh; background: var(--bg-body); position: fixed; inset: 0; z-index: 9998;">
        <div style="margin-top: 20vh;">
            <i class="fas fa-user-shield fa-4x" style="color: var(--accent); margin-bottom: 20px;"></i>
            <h2>שלום לשליח</h2>
            <p style="color:var(--text-muted); margin: 10px 0 30px;">התחבר כדי לסנכרן נתונים מהדרייב</p>
            <button onclick="fieldApp.login()" class="map-anchor-btn" style="width: 100%; border-radius: 15px; background: var(--accent); color: white; font-weight: bold; height: 50px; font-family: Assistant;">
                <i class="fab fa-google" style="margin-left: 10px;"></i> התחבר ל-Google Drive
            </button>
        </div>
    </div>

    <div id="view-map" class="view-container active" style="padding-top:0;">
        <div id="f-map" style="width: 100%; height: 100%; position: absolute;"></div>
        <div class="theme-anchor" onclick="fieldApp.toggleDarkMode()" id="f-theme-btn"><i class="fas fa-moon"></i></div>
        <div class="map-anchors">
            <div class="map-anchor-btn" onclick="fieldApp.jumpToCenter()"><img src="favicon.ico" style="width:20px;"></div>
            <div class="map-anchor-btn" onclick="fieldApp.recenter()"><i class="fas fa-location-arrow"></i></div>
        </div>
    </div>

    <div id="view-tasks" class="view-container" style="padding: 80px 20px 20px 20px;">
        <h2 style="margin-bottom:20px;"><i class="fas fa-check-double" style="color:var(--accent)"></i> משימות להיום</h2>
        <div id="f-tasks-list"></div>
    </div>

    <div id="view-community" class="view-container" style="padding: 80px 20px 20px 20px;">
        <h2 style="margin-bottom:20px;"><i class="fas fa-users" style="color:var(--success)"></i> קהילה</h2>
        <div id="f-community-list"></div>
    </div>

    <div id="f-scrim" onclick="fieldApp.closeOverlays()"></div>

    <div id="f-sheet" class="f-sheet">
        <div class="f-sheet-handle"></div>
        <div id="f-sheet-content"></div>
    </div>

    <div id="f-route-sheet" class="f-sheet">
        <div class="f-sheet-handle"></div>
        <h3 style="margin: 0 0 15px 0; font-size: 20px;"><i class="fas fa-route" style="color:var(--accent);"></i> בניית מסלול חכם</h3>
        <div style="display:flex; flex-direction:column; gap:12px;">
            <button class="f-fab-option" style="width:100%; justify-content:center;" onclick="fieldApp.buildRoute('tasks')">
                <i class="fas fa-check-double"></i> מסלול מהמשימות הפתוחות
            </button>
            <button class="f-fab-option" style="width:100%; justify-content:center;" onclick="fieldApp.buildRoute('community')">
                <i class="fas fa-users"></i> מסלול מ-10 משפחות קרובות
            </button>
            <button class="f-fab-option mission" style="width:100%; justify-content:center;" onclick="fieldApp.buildRoute('buildings')">
                <i class="fas fa-map-pin"></i> מסלול מבניינים שסומנו ידנית (<span id="f-bldg-count">0</span>)
            </button>
        </div>
    </div>

    <div id="f-voice-sheet" class="f-sheet">
        <div class="f-sheet-handle"></div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h3 style="margin: 0; font-size: 20px;"><i class="fas fa-microphone" style="color:var(--danger);"></i> סיכום ביקור</h3>
            <span id="f-voice-status-badge" style="background:var(--border-light); color:var(--text-main); padding:4px 10px; border-radius:12px; font-size:13px; font-weight:bold;">סטטוס</span>
        </div>
        <p style="color:var(--text-muted); font-size:14px; margin-bottom:15px;">דבר עכשיו או הקלד, הסיכום והסטטוס יישמרו במערכת.</p>
        <textarea id="f-voice-result" rows="3" style="width:100%; border-radius:12px; border:1px solid var(--border-light); padding:10px; font-family:inherit; font-size:16px; margin-bottom:15px; background:var(--bg-body); color:var(--text-main);" placeholder="הקלטה תופיע כאן..."></textarea>
        <div style="display:flex; justify-content:center; margin-bottom:20px;">
            <button id="f-mic-btn" onclick="fieldApp.toggleVoiceRecording()" style="width:60px; height:60px; border-radius:50%; background:var(--text-muted); color:white; border:none; font-size:24px; box-shadow:var(--shadow); cursor:pointer; transition:0.3s;">
                <i class="fas fa-microphone"></i>
            </button>
        </div>
        <button style="width: 100%; padding: 14px; background: var(--success); color: white; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor:pointer;" onclick="fieldApp.saveVisitLog()">
            <i class="fas fa-save"></i> שמור ביקור
        </button>
    </div>

    <div id="f-add-family-sheet" class="f-sheet">
        <div class="f-sheet-handle"></div>
        <h3 style="margin: 0 0 15px 0; font-size: 20px;"><i class="fas fa-user-plus" style="color:var(--accent);"></i> הוספת משפחה</h3>
        <input type="text" id="f-add-fam-name" placeholder="שם המשפחה (לדוגמה: כהן)" style="width:100%; padding:12px; margin-bottom:10px; border-radius:8px; border:1px solid var(--border-light); background:var(--bg-body); color:var(--text-main); font-family:inherit; font-size:16px;">
        <input type="text" id="f-add-fam-address" placeholder="כתובת (רחוב ומספר)" style="width:100%; padding:12px; margin-bottom:10px; border-radius:8px; border:1px solid var(--border-light); background:var(--bg-body); color:var(--text-main); font-family:inherit; font-size:16px;">
        <input type="tel" id="f-add-fam-phone" placeholder="טלפון" style="width:100%; padding:12px; margin-bottom:20px; border-radius:8px; border:1px solid var(--border-light); background:var(--bg-body); color:var(--text-main); font-family:inherit; font-size:16px;">
        <button style="width: 100%; padding: 14px; background: var(--accent); color: white; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor:pointer;" onclick="fieldApp.saveNewFamily()">
            <i class="fas fa-save"></i> הוסף למערכת
        </button>
    </div>

    <div id="f-add-task-sheet" class="f-sheet">
        <div class="f-sheet-handle"></div>
        <h3 style="margin: 0 0 15px 0; font-size: 20px;"><i class="fas fa-tasks" style="color:var(--accent);"></i> הוספת משימה כללית</h3>
        <input type="text" id="f-add-task-text" placeholder="מה צריך לעשות?" style="width:100%; padding:12px; margin-bottom:20px; border-radius:8px; border:1px solid var(--border-light); background:var(--bg-body); color:var(--text-main); font-family:inherit; font-size:16px;">
        <button style="width: 100%; padding: 14px; background: var(--accent); color: white; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor:pointer;" onclick="fieldApp.saveNewTask()">
            <i class="fas fa-plus"></i> צור משימה
        </button>
    </div>

    <nav class="f-bottom-nav">
        <div class="nav-item active" onclick="fieldApp.switchView('map', this)"><i class="fas fa-map-marked-alt"></i><span>מפה</span></div>
        <div class="nav-item" onclick="fieldApp.switchView('tasks', this)"><i class="fas fa-clipboard-list"></i><span>משימות</span></div>
        <div class="nav-item" onclick="fieldApp.switchView('community', this)"><i class="fas fa-address-book"></i><span>קהילה</span></div>
    </nav>

    <div class="f-fab-center" id="f-fab-wrapper">
        <button class="f-fab-main" onclick="fieldApp.toggleFab()"><i class="fas fa-plus"></i></button>
        <div class="f-fab-menu">
            <div class="f-fab-option mission" onclick="fieldApp.openRouteMenu()"><i class="fas fa-route"></i> צא למבצעים</div>
            <div class="f-fab-option" onclick="fieldApp.openAddFamily()"><i class="fas fa-user-plus"></i> הוסף משפחה</div>
            <div class="f-fab-option" onclick="fieldApp.openAddTask()"><i class="fas fa-tasks"></i> הוסף משימה</div>
        </div>
    </div>

    <script src="https://accounts.google.com/gsi/client"></script>
    <script src="https://apis.google.com/js/api.js"></script>
    <script src="field-app.js?v=23"></script>
</body>
</html>
