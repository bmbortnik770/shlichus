<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="שטח CRM">
    <title>אפליקציית שטח</title>

    <link rel="manifest" href="field-manifest.json">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="favicon.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet' />

    <script src="https://accounts.google.com/gsi/client"></script>
    <script src="https://apis.google.com/js/api.js"></script>

    <link rel="stylesheet" href="field-style.css">
</head>
<body>

    <div id="f-splash" class="f-splash">
        <i class="fas fa-map-marked-alt pulse-logo"></i>
        <h1>מערכת שטח</h1>
        <div class="f-spinner"></div>
        <p id="f-splash-text">טוען נתוני קהילה...</p>
    </div>

    <div id="f-auth" class="f-auth hidden">
        <div class="f-auth-card">
            <i class="fas fa-user-shield"></i>
            <h2>התחברות לשטח</h2>
            <p>האפליקציה דורשת סנכרון מאובטח מול הדרייב.</p>
            <div id="f-google-btn" style="display:flex; justify-content:center; margin: 20px 0;"></div>
            <button class="f-btn-text" onclick="fieldApp.continueOffline()">המשך במצב אופליין (ללא סנכרון)</button>
        </div>
    </div>

    <div id="f-map" class="f-map"></div>

    <div class="f-top-bar">
        <div class="f-omnibar" onclick="fieldApp.openSearch()">
            <i class="fas fa-search"></i>
            <span>חיפוש משפחה, טלפון, רחוב...</span>
        </div>
        <button id="f-outbox-btn" class="f-outbox-btn hidden" onclick="fieldApp.openOutboxStatus()">
            <i class="fas fa-cloud-upload-alt"></i> <span id="f-outbox-count">1</span>
        </button>
    </div>

    <div id="f-fab-menu" class="f-fab-menu">
        <div class="f-fab-options hidden" id="f-fab-options">
            <button class="f-fab-option" onclick="fieldApp.fabAction('new_family')">
                <div class="f-fab-icon" style="background:var(--success);"><i class="fas fa-user-plus"></i></div>
                <span>משפחה חדשה</span>
            </button>
            <button class="f-fab-option" onclick="fieldApp.fabAction('new_task')">
                <div class="f-fab-icon" style="background:var(--accent);"><i class="fas fa-check"></i></div>
                <span>משימה כללית</span>
            </button>
            <button class="f-fab-option" onclick="fieldApp.fabAction('nav_center')">
                <div class="f-fab-icon" style="background:var(--warning);"><i class="fas fa-crosshairs"></i></div>
                <span>מרכז אותי</span>
            </button>
        </div>
        <button class="f-fab-main" id="f-fab-main" onclick="fieldApp.toggleFab()">
            <i class="fas fa-plus"></i>
        </button>
    </div>

    <div id="f-scrim" class="f-scrim hidden" onclick="fieldApp.closeSheet()"></div>

    <script src="field-app.js"></script>
</body>
</html>
