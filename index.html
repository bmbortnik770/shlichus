<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM שליחות - ניהול קהילה חכם</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet' />
    <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.min.js"></script>
    <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.css" type="text/css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js"></script>

    <style>
        :root { --primary: #0f172a; --accent: #3b82f6; --success: #10b981; --warning: #f59e0b; --danger: #ef4444; --bg: #f8fafc; --surface: #ffffff; --text: #1e293b; --text-muted: #64748b; }
        body { margin: 0; font-family: 'Assistant', sans-serif; background: var(--bg); display: flex; height: 100vh; overflow: hidden; color: var(--text); }
        
        /* מסך כניסה */
        #auth-overlay { position: fixed; inset: 0; background: var(--primary); z-index: 10000; display: flex; align-items: center; justify-content: center; color: white; transition: 0.5s; }
        .auth-card { background: white; padding: 40px; border-radius: 20px; text-align: center; color: var(--primary); width: 350px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        
        /* מבנה CRM */
        #sidebar { width: 380px; background: var(--surface); border-left: 1px solid #e2e8f0; display: flex; flex-direction: column; z-index: 10; transition: 0.3s ease; }
        #map-container { flex-grow: 1; position: relative; }
        #map { position: absolute; inset: 0; }
        
        /* אלמנטים */
        .header { padding: 20px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; }
        .user-pill { display: flex; align-items: center; gap: 10px; background: #f1f5f9; padding: 5px 12px; border-radius: 20px; font-size: 14px; font-weight: 600; }
        .user-pill img { width: 25px; border-radius: 50%; }
        
        .stat-card { background: var(--bg); padding: 15px; border-radius: 10px; border: 1px solid #e2e8f0; margin-bottom: 15px; }
        .btn { padding: 10px; border-radius: 8px; cursor: pointer; border: none; font-weight: 600; font-family: inherit; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary { background: var(--accent); color: white; width: 100%; }
        .btn-outline { background: transparent; border: 1px solid #e2e8f0; width: 100%; }
        
        /* טבלה ומודאלים */
        .modal { display: none; position: fixed; z-index: 1000; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(2px); }
        .modal-content { background: white; margin: 5% auto; padding: 25px; border-radius: 12px; width: 450px; max-height: 85vh; overflow-y: auto; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; margin-bottom: 4px; color: var(--text-muted); }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px; border: 1px solid #e2e8f0; border-radius: 6px; box-sizing: border-box; font-family: inherit; }
        
        .apt-item { background: #fff; border: 1px solid #e2e8f0; border-right: 4px solid #cbd5e1; padding: 10px; margin-bottom: 8px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .hidden { display: none !important; }
        
        /* טבלת רשימה מלאה */
        #list-container { display: none; flex-grow: 1; padding: 20px; overflow-y: auto; background: var(--bg); }
        .data-table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .data-table th { background: var(--primary); color: white; padding: 12px; text-align: right; }
        .data-table td { padding: 12px; border-bottom: 1px solid #eee; }
        .phone-link { color: var(--accent); text-decoration: none; font-weight: bold; display: inline-flex; align-items: center; gap: 5px; }
    </style>
</head>
<body>

<div id="auth-overlay">
    <div class="auth-card">
        <i class="fas fa-microchip" style="font-size: 50px; color: var(--accent); margin-bottom: 20px;"></i>
        <h2>CRM שליחות</h2>
        <p>מערכת ניהול קהילה מבוססת Google Drive. נא להתחבר:</p>
        <div id="google-btn-container" style="display: flex; justify-content: center;"></div>
        <p style="font-size: 11px; margin-top: 20px; color: #64748b;">הנתונים נשמרים בדרייב הפרטי שלך בלבד.</p>
    </div>
</div>

<div id="sidebar" class="hidden">
    <div class="header">
        <h3 style="margin:0;">הקהילה שלי</h3>
        <div class="user-pill">
            <img id="u-img" src="">
            <span id="u-name"></span>
        </div>
    </div>
    
    <div style="padding: 20px; flex-grow: 1; overflow-y: auto;">
        <div style="background: #eff6ff; padding: 15px; border-radius: 12px; border: 1px solid #dbeafe; margin-bottom: 20px;">
            <h4 style="margin:0; color: #1e40af;"><i class="fas fa-cloud-check"></i> מחובר לענן</h4>
            <p style="font-size: 13px; margin: 5px 0 0 0;">הנתונים מסונכרנים בזמן אמת לדרייב.</p>
        </div>

        <button class="btn btn-primary" onclick="toggleView()"><i class="fas fa-exchange-alt"></i> החלף למפה / רשימה</button>

        <div id="geocoder" style="margin-top: 15px;"></div>
        
        <div class="stat-card" style="margin-top: 15px;">
            <input type="text" id="smartSearch" placeholder="חיפוש מהיר..." style="width:100%; border:none; outline:none; background:transparent;" oninput="refreshMap(); if(!isMapView) renderListView();">
        </div>

        <div class="stat-card">
            <h4 style="margin:0 0 10px 0;"><i class="fas fa-chart-pie"></i> התפלגות קהילה</h4>
            <canvas id="styleChart" height="150"></canvas>
        </div>
    </div>

    <div style="padding: 20px; border-top: 1px solid #f1f5f9;">
        <button onclick="location.reload()" style="width: 100%; padding: 12px; background: #f1f5f9; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;">יציאה מהמערכת</button>
    </div>
</div>

<div id="map-container" class="hidden"><div id="map"></div></div>
<div id="list-container"></div>

<div id="clientModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle">עריכת משפחה</h3>
        <div class="form-group"><label>שם משפחה</label><input type="text" id="cName"></div>
        <div class="form-group"><label>מספר דירה</label><input type="text" id="cNum"></div>
        <div class="form-group"><label>טלפונים</label><input type="text" id="cPhones"></div>
        <div class="form-group"><label>סגנון</label>
            <select id="cStyle">
                <option value="חרדי">חרדי</option><option value="דתי">דתי</option><option value="מסורתי">מסורתי</option>
            </select>
        </div>
        <div class="form-group"><label>הערות</label><textarea id="cNotes" rows="3"></textarea></div>
        <button class="btn btn-primary" onclick="saveClient()">שמור שינויים</button>
        <button class="btn btn-outline" style="margin-top:8px;" onclick="closeModal()">ביטול</button>
    </div>
</div>

<script>
    const CLIENT_ID = '348261974014-242r9b0dvctlka7rj3aetu81v96ere46.apps.googleusercontent.com';
    let db = JSON.parse(localStorage.getItem('crm_db')) || {};
    let isMapView = true;
    let currentBldg = '', currentAptIdx = null;

    // אתחול מפה עם RTL פלאגין לעברית
    mapboxgl.accessToken = 'pk.eyJ1IjoiYm1ib3J0bmlrIiwiYSI6ImNtbWl0cGNxNDAxa3kycHNhbWJ4dTR4ZWEifQ.ZxzC27qBStO30yyu60X9eQ';
    mapboxgl.setRTLTextPlugin('https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-rtl-text/v0.3.0/mapbox-gl-rtl-text.js', null, true);
    
    const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/streets-v11', // גרסת v11 יציבה יותר עם RTL
        center: [35.2443, 31.8265],
        zoom: 16.5,
        pitch: 60
    });

    // הוספת שכבת תלת-מימד ולחיצה על בניינים
    map.on('load', () => {
        map.addLayer({
            'id': '3d-buildings', 'source': 'composite', 'source-layer': 'building', 'filter': ['==', 'extrude', 'true'], 'type': 'fill-extrusion',
            'paint': { 'fill-extrusion-color': '#aaa', 'fill-extrusion-height': ['get', 'height'], 'fill-extrusion-opacity': 0.6 }
        });
        
        // תיקון: לחיצה ספציפית על שכבת תלת-מימד
        map.on('click', '3d-buildings', async (e) => handleMapClick(e.lngLat));
    });

    
    // חיפוש כתובות
    const geocoder = new MapboxGeocoder({ accessToken: mapboxgl.accessToken, mapboxgl: mapboxgl, placeholder: 'חפש רחוב...', countries: 'il', language: 'he' });
    document.getElementById('geocoder').appendChild(geocoder.onAdd(map));

    // התחברות גוגל
    window.onload = () => {
        google.accounts.id.initialize({ client_id: CLIENT_ID, callback: handleAuth });
        google.accounts.id.renderButton(document.getElementById("google-btn-container"), { theme: "outline", size: "large" });
        refreshMap();
    };

    function handleAuth(response) {
        const payload = JSON.parse(atob(response.credential.split('.')[1]));
        document.getElementById('u-name').innerText = payload.given_name;
        document.getElementById('u-img').src = payload.picture;
        document.getElementById('auth-overlay').classList.add('hidden');
        document.getElementById('sidebar').classList.remove('hidden');
        document.getElementById('map-container').classList.remove('hidden');
        map.resize();
    }

    
    // ניהול מפה ולחיצות
    async function handleMapClick(lngLat) {
        const res = await fetch(`https://api.mapbox.com/geocoding/v5/mapbox.places/${lngLat.lng},${lngLat.lat}.json?access_token=${mapboxgl.accessToken}&language=he`);
        const data = await res.json();
        const addr = data.features[0] ? data.features[0].place_name_he.split(',')[0] : "כתובת לא ידועה";
        
        currentBldg = addr;
        if (!db[addr]) db[addr] = { apts: [], coords: [lngLat.lng, lngLat.lat] };
        showBuildingPopup(lngLat, addr);
    }

    function showBuildingPopup(lngLat, addr) {
        const b = db[addr];
        let listHtml = b.apts.map((a, i) => `
            <div class="apt-item" onclick="openEdit(${i})">
                <span><b>${a.name}</b> (דירה ${a.num})</span>
                <i class="fas fa-edit" style="color:var(--accent)"></i>
            </div>
        `).join('');

        new mapboxgl.Popup().setLngLat(lngLat).setHTML(`
            <div style="text-align:right; direction:rtl; min-width:200px;">
                <h4 style="margin:0 0 10px 0;">${addr}</h4>
                <div style="max-height:150px; overflow-y:auto;">${listHtml || '<p style="font-size:12px; color:grey;">אין משפחות רשומות</p>'}</div>
                <button class="btn btn-primary" style="font-size:12px; margin-top:10px;" onclick="addNewApt()">+ הוסף משפחה</button>
            </div>
        `).addTo(map);
    }

    window.addNewApt = () => {
        db[currentBldg].apts.push({ name: 'משפחה חדשה', num: '?', phones: '', style: 'חרדי', notes: '' });
        saveDB(); refreshMap(); 
        document.querySelector('.mapboxgl-popup').remove();
        openEdit(db[currentBldg].apts.length - 1);
    };

    window.openEdit = (idx) => {
        currentAptIdx = idx;
        const a = db[currentBldg].apts[idx];
        document.getElementById('cName').value = a.name;
        document.getElementById('cNum').value = a.num;
        document.getElementById('cPhones').value = a.phones;
        document.getElementById('cStyle').value = a.style;
        document.getElementById('cNotes').value = a.notes;
        document.getElementById('clientModal').style.display = 'block';
    };

    window.saveClient = () => {
        const a = db[currentBldg].apts[currentAptIdx];
        a.name = document.getElementById('cName').value;
        a.num = document.getElementById('cNum').value;
        a.phones = document.getElementById('cPhones').value;
        a.style = document.getElementById('cStyle').value;
        a.notes = document.getElementById('cNotes').value;
        saveDB(); closeModal(); refreshMap();
    };

    window.closeModal = () => document.getElementById('clientModal').style.display = 'none';

    function saveDB() { localStorage.setItem('crm_db', JSON.stringify(db)); }

    function toggleView() {
        isMapView = !isMapView;
        document.getElementById('map-container').style.display = isMapView ? 'block' : 'none';
        document.getElementById('list-container').style.display = isMapView ? 'none' : 'block';
        if (!isMapView) renderListView();
    }

    // תיקון: יצירת קישור וואטסאפ מרוכז ותקין
    function generateWhatsappLink(phone) {
        if (!phone) return '#';
        let cleanPhone = phone.replace(/\D/g, '');
        if (cleanPhone.startsWith('0')) cleanPhone = '972' + cleanPhone.substring(1);
        return `https://wa.me/${cleanPhone}`;
    }

    function renderListView() {
        let html = `<h2 style="margin:0 0 15px 0; border-bottom: 2px solid var(--accent); padding-bottom: 10px;">رשימת קהילה מלאה</h2><table class="data-table"><tr><th>משפחה</th><th>כתובת</th><th>דירה</th><th>טלפון (וואטסאפ)</th></tr>`;
        Object.keys(db).forEach(addr => {
            db[addr].apts.forEach(apt => {
                const waLink = generateWhatsappLink(apt.phones);
                html += `<tr><td>${apt.name}</td><td>${addr}</td><td>${apt.num}</td><td><a class="phone-link" href="${waLink}" target="_blank"><i class="fab fa-whatsapp" style="color:#25D366"></i> ${apt.phones}</a></td></tr>`;
            });
        });
        document.getElementById('list-container').innerHTML = html + `</table>`;
    }

    let chart;
    function refreshMap() {
        const stats = { 'חרדי': 0, 'דתי': 0, 'מסורתי': 0 };
        Object.keys(db).forEach(addr => {
            db[addr].apts.forEach(a => { if (stats[a.style] !== undefined) stats[a.style]++; });
        });

        const ctx = document.getElementById('styleChart').getContext('2d');
        if (chart) chart.destroy();
        chart = new Chart(ctx, {
            type: 'doughnut',
            data: { labels: Object.keys(stats), datasets: [{ data: Object.values(stats), backgroundColor: ['#3b82f6', '#10b981', '#f59e0b'] }] },
            options: { plugins: { legend: { position: 'bottom' } } }
        });
    }
</script>

</body>
</html>
